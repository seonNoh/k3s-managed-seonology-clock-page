apiVersion: apps/v1
kind: Deployment
metadata:
  name: seonology-clock-page
  namespace: seonology-apps
  annotations:
    seonology.io/manifest-authority: "reference-only; live desired state is managed in seonology-k3s GitOps"
  labels:
    app: seonology-clock-page
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seonology-clock-page
  template:
    metadata:
      labels:
        app: seonology-clock-page
      annotations:
        # OTel Operator: Node.js SDK 자동 주입.
        instrumentation.opentelemetry.io/inject-nodejs: "seonology-tracing/seonology-tracing"
    spec:
      serviceAccountName: seonology-clock-page
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        node-type: lima
      tolerations:
        - key: node-type
          operator: Equal
          value: home
          effect: NoSchedule
      containers:
      - name: seonology-clock-page
        image: ghcr.io/seonnoh/seonology-clock-page:v1.44.0
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 3001
          name: api
        env:
        - name: BOOKMARKS_DIR
          value: /data
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: clock-page-secrets
              key: github-token
              optional: true
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: clock-page-secrets
              key: gemini-api-key
              optional: true
        - name: TAILSCALE_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: clock-page-secrets
              key: tailscale-oauth-client-id
              optional: true
        - name: TAILSCALE_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: clock-page-secrets
              key: tailscale-oauth-client-secret
              optional: true
        - name: NAS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clock-page-secrets
              key: nas-password
              optional: true
        - name: NAS_HOST
          value: "100.94.199.8"
        - name: NAS_PORT
          value: "5001"
        - name: NAS_ACCOUNT
          value: "seon"
        - name: GRAFANA_URL
          value: "http://kube-prometheus-stack-grafana.monitoring:80"
        - name: GRAFANA_USER
          value: "admin"
        - name: GRAFANA_PASS
          valueFrom:
            secretKeyRef:
              name: clock-page-secrets
              key: grafana-admin-pass
              optional: true
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: clock-page-secrets
              key: google-client-id
              optional: true
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: clock-page-secrets
              key: google-client-secret
              optional: true
        - name: MS_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: clock-page-secrets
              key: ms-client-id
              optional: true
        - name: MS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: clock-page-secrets
              key: ms-client-secret
              optional: true
        volumeMounts:
        - name: bookmarks-data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run/nginx
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 30
          periodSeconds: 2
      volumes:
      - name: bookmarks-data
        persistentVolumeClaim:
          claimName: clock-bookmarks-pvc
      - name: tmp
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}

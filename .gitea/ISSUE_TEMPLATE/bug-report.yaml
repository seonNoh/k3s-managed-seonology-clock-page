name: Bug report
about: Report behavior that differs from the documented dashboard or API contract
title: "fix: "
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [React dashboard, Express API, Browser extension, Shared toolkit, Container image, Gitea workflow, Live deployment]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, passwords, account details, and private URLs.
      render: text

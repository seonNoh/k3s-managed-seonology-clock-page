name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run web unit tests
        run: npm run test:unit

      - name: Install and test API
        run: |
          npm ci --prefix api
          npm run test:api

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Build web
        run: npm run build

      - name: Build extension independently
        run: |
          npm ci --prefix toolkit-extension
          npm run build --prefix toolkit-extension

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix api --omit=dev --audit-level=high
          npm audit --prefix toolkit-extension --omit=dev --audit-level=high

      - name: Container health smoke
        run: npm run smoke:container

  plan:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      base_sha: ${{ steps.release.outputs.base_sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Plan native release
        id: release
        run: node scripts/release-gate.mjs

  image:
    needs: plan
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set lowercase owner
        id: lowercase
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/seonology-clock-page:v${{ needs.plan.outputs.version }}
            ghcr.io/${{ steps.lowercase.outputs.owner }}/seonology-clock-page:latest
          build-args: |
            APP_VERSION=${{ needs.plan.outputs.version }}
          cache-from: type=gha
          # 캐시 export는 best-effort. gha 캐시 백엔드의 일시적 오류
          # (error writing layer blob: not_found)로 이미지 푸시 성공 후에도
          # 빌드 스텝이 실패 처리되던 문제를 막는다.
          cache-to: type=gha,mode=max,ignore-error=true

  publish:
    needs: [plan, image]
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish planned release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release-publish.mjs

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" lang="ja" role="img" aria-labelledby="cp58dja-title cp58dja-desc">
<title id="cp58dja-title">ワークフローのイベントとリリース分岐</title>
<desc id="cp58dja-desc">mainはCIとImageを独立実行し、PRはCIだけを実行します。</desc>
<style>
  svg{
    --bg:#0d1117; --surface-a:#1b222c; --surface-b:#151b23;
    --lead-a:#222b38; --lead-b:#19202a;
    --inner:#1e2530; --inner-lead:#232c39;
    --line:#252d38; --line-lead:#33404f;
    --text:#f0f6fc; --body:#c3ccd6; --dim:#a2abb5; --faint:#8d959f;
    --accent:#7c9fff; --accent-bg:rgba(124,159,255,.16);
    --ok:#4ac97e; --warn:#e0a740; --bad:#f2705e; --off:#8b939d;
    --quiet:#78818c;
    --sh:#000; --sh-op:.50; --shl-op:.58; --shs-op:.40;
    --glow-op:.40; --glow-cast:.45; --hl:rgba(255,255,255,.05);
  }
  @media (prefers-color-scheme: light){
    svg{
      --bg:#f6f8fa; --surface-a:#ffffff; --surface-b:#fafbfc;
      --lead-a:#ffffff; --lead-b:#f5f8ff;
      --inner:#eef1f4; --inner-lead:#e9f0fe;
      --line:#d8dee4; --line-lead:#b8c9ee;
      --text:#1f2328; --body:#3d444d; --dim:#59636e; --faint:#656d7a;
      --accent:#2f62d4; --accent-bg:rgba(47,98,212,.10);
      --ok:#187734; --warn:#8e5f00; --bad:#cf222e; --off:#5f6773;
      --quiet:#6e7781;
      --sh:#1f2328; --sh-op:.13; --shl-op:.18; --shs-op:.12;
      --glow-op:.35; --glow-cast:.14; --hl:transparent;
    }
  }
  .cp58dja-flow{fill:none;stroke:var(--accent);stroke-width:1.6;
          stroke-linecap:round;stroke-linejoin:round;
          stroke-dasharray:5 6;animation:cp58dja-move 2s linear infinite}
  .cp58dja-quiet{fill:none;stroke:var(--quiet);stroke-width:1.4;
           stroke-linecap:round;stroke-linejoin:round}
  @keyframes cp58dja-move{to{stroke-dashoffset:-22}}
  @media (prefers-reduced-motion:reduce){.cp58dja-flow{animation:none}}
</style>
<defs>
  <filter id="cp58dja-sh" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="var(--sh)" flood-opacity="var(--sh-op)"/>
  </filter>
  <filter id="cp58dja-shl" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="var(--sh)" flood-opacity="var(--shl-op)"/>
  </filter>
  <filter id="cp58dja-shs" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="var(--sh)" flood-opacity="var(--shs-op)"/>
  </filter>
  <filter id="cp58dja-gl" x="-60%" y="-90%" width="220%" height="280%">
    <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="var(--accent)" flood-opacity="var(--glow-op)"/>
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="var(--sh)" flood-opacity="var(--glow-cast)"/>
  </filter>
  <linearGradient id="cp58dja-s" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/>
  </linearGradient>
  <linearGradient id="cp58dja-sl" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/>
  </linearGradient>
  <marker id="cp58dja-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/>
  </marker>
  <marker id="cp58dja-tq" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/>
  </marker>
</defs>
<style>
  .cp58dja-root{font-family:"Pretendard",system-ui,-apple-system,sans-serif}
  .cp58dja-root{fill:var(--body)}
  .cp58dja-title{font-size:20px;font-weight:600;fill:var(--text)}
  .cp58dja-sub{font-size:13.5px;fill:var(--dim)}
  .cp58dja-name{font-size:15px;font-weight:500}
  .cp58dja-label{font-size:13px}
  .cp58dja-mono{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
  .cp58dja-foot{font-size:13px;fill:var(--faint)}
  .cp58dja-surface{fill:url(#cp58dja-s);stroke:var(--line);stroke-width:1}
  .cp58dja-lead{fill:url(#cp58dja-sl);stroke:var(--line-lead);stroke-width:1}
  .cp58dja-region{fill:var(--inner);stroke:var(--line);stroke-width:1}
  .cp58dja-cell{fill:var(--inner);stroke:var(--line);stroke-width:1}
  .cp58dja-highlight{stroke:var(--hl);stroke-width:1}
  .cp58dja-support{fill:var(--accent)}
  .cp58dja-off{fill:var(--faint)}
  </style>
<g class="cp58dja-root">
<rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>
<text x="32" y="40" class="cp58dja-title">ワークフローのイベントとリリース分岐</text>
<text x="32" y="66" class="cp58dja-sub">mainはCIとImageを独立実行し、PRはCIだけを実行します。</text>
<rect id="cp58dja-main" data-kind="card" x="32" y="88" width="160" height="56" rx="12" class="cp58dja-surface" filter="url(#cp58dja-sh)"/>
<path d="M48,89 H176" class="cp58dja-highlight"/>
<text x="52" y="120" class="cp58dja-label" data-box="cp58dja-main">push: main</text>
<rect id="cp58dja-ci" data-kind="card" x="320" y="88" width="320" height="56" rx="12" class="cp58dja-surface" filter="url(#cp58dja-sh)"/>
<path d="M336,89 H624" class="cp58dja-highlight"/>
<text x="340" y="120" class="cp58dja-label" data-box="cp58dja-ci">ci.yml · quality</text>
<rect id="cp58dja-pr" data-kind="card" x="736" y="88" width="192" height="56" rx="12" class="cp58dja-surface" filter="url(#cp58dja-sh)"/>
<path d="M752,89 H912" class="cp58dja-highlight"/>
<text x="756" y="120" class="cp58dja-label" data-box="cp58dja-pr">PR: main</text>
<rect id="cp58dja-image" data-kind="card" x="320" y="176" width="320" height="56" rx="12" class="cp58dja-lead" filter="url(#cp58dja-shl)"/>
<path d="M336,177 H624" class="cp58dja-highlight"/>
<text x="340" y="208" class="cp58dja-label" data-box="cp58dja-image">image.yml · publish</text>
<rect id="cp58dja-tags" data-kind="card" x="736" y="176" width="192" height="56" rx="12" class="cp58dja-surface" filter="url(#cp58dja-sh)"/>
<path d="M752,177 H912" class="cp58dja-highlight"/>
<text x="756" y="208" class="cp58dja-label" data-box="cp58dja-tags">main / sha-&lt;12 hex&gt;</text>
<path class="cp58dja-quiet" d="M192,116 L320,116" marker-end="url(#cp58dja-tq)" data-from="cp58dja-main" data-to="cp58dja-ci" data-pts="192,116;320,116"/>
<path class="cp58dja-flow" d="M192,116 L252.0,116.0 Q256,116 256.0,120.0 L256.0,200.0 Q256,204 260.0,204.0 L320,204" marker-end="url(#cp58dja-t)" data-from="cp58dja-main" data-to="cp58dja-image" data-pts="192,116;256,116;256,204;320,204"/>
<path class="cp58dja-quiet" d="M736,116 L640,116" marker-end="url(#cp58dja-tq)" data-from="cp58dja-pr" data-to="cp58dja-ci" data-pts="736,116;640,116"/>
<path class="cp58dja-quiet" d="M640,204 L736,204" marker-end="url(#cp58dja-tq)" data-from="cp58dja-image" data-to="cp58dja-tags" data-pts="640,204;736,204"/>
<text x="32" y="248" class="cp58dja-mono">workflow_dispatch · CI / Image / Release · tag = v + VERSION</text>
<rect id="cp58dja-release" data-kind="region" x="24" y="264" width="912" height="264" rx="12" class="cp58dja-region"/>
<text x="44" y="296" class="cp58dja-mono" data-box="cp58dja-release">release.yml</text>
<rect id="cp58dja-tag" data-kind="card" x="40" y="312" width="144" height="56" rx="12" class="cp58dja-surface" filter="url(#cp58dja-sh)"/>
<path d="M56,313 H168" class="cp58dja-highlight"/>
<text x="60" y="344" class="cp58dja-label" data-box="cp58dja-tag">vX.Y.Z</text>
<rect id="cp58dja-lookup" data-kind="card" x="232" y="312" width="160" height="56" rx="12" class="cp58dja-surface" filter="url(#cp58dja-sh)"/>
<path d="M248,313 H376" class="cp58dja-highlight"/>
<text x="252" y="344" class="cp58dja-label" data-box="cp58dja-lookup">イメージ照会</text>
<rect id="cp58dja-build" data-kind="card" x="448" y="312" width="192" height="56" rx="12" class="cp58dja-surface" filter="url(#cp58dja-sh)"/>
<path d="M464,313 H624" class="cp58dja-highlight"/>
<text x="468" y="344" class="cp58dja-label" data-box="cp58dja-build">ビルドと公開</text>
<rect id="cp58dja-platform" data-kind="card" x="704" y="312" width="208" height="56" rx="12" class="cp58dja-lead" filter="url(#cp58dja-shl)"/>
<path d="M720,313 H896" class="cp58dja-highlight"/>
<text x="724" y="344" class="cp58dja-label" data-box="cp58dja-platform">プラットフォーム確認</text>
<rect id="cp58dja-stop" data-kind="card" x="40" y="448" width="144" height="56" rx="12" class="cp58dja-surface" filter="url(#cp58dja-sh)"/>
<path d="M56,449 H168" class="cp58dja-highlight"/>
<text x="60" y="480" class="cp58dja-label" data-box="cp58dja-stop">停止</text>
<rect id="cp58dja-create" data-kind="card" x="232" y="448" width="160" height="56" rx="12" class="cp58dja-surface" filter="url(#cp58dja-sh)"/>
<path d="M248,449 H376" class="cp58dja-highlight"/>
<text x="252" y="480" class="cp58dja-label" data-box="cp58dja-create">リリース作成</text>
<rect id="cp58dja-done" data-kind="card" x="448" y="448" width="192" height="56" rx="12" class="cp58dja-surface" filter="url(#cp58dja-sh)"/>
<path d="M464,449 H624" class="cp58dja-highlight"/>
<text x="468" y="480" class="cp58dja-label" data-box="cp58dja-done">完了</text>
<rect id="cp58dja-releaseLookup" data-kind="card" x="704" y="448" width="208" height="56" rx="12" class="cp58dja-surface" filter="url(#cp58dja-sh)"/>
<path d="M720,449 H896" class="cp58dja-highlight"/>
<text x="724" y="480" class="cp58dja-label" data-box="cp58dja-releaseLookup">リリース照会</text>
<path class="cp58dja-quiet" d="M184,340 L232,340" marker-end="url(#cp58dja-tq)" data-from="cp58dja-tag" data-to="cp58dja-lookup" data-pts="184,340;232,340"/>
<path class="cp58dja-quiet" d="M392,340 L448,340" marker-end="url(#cp58dja-tq)" data-from="cp58dja-lookup" data-to="cp58dja-build" data-pts="392,340;448,340"/>
<text x="420" y="329" class="cp58dja-label" text-anchor="middle">失敗</text>
<path class="cp58dja-flow" d="M640,340 L704,340" marker-end="url(#cp58dja-t)" data-from="cp58dja-build" data-to="cp58dja-platform" data-pts="640,340;704,340"/>
<path class="cp58dja-quiet" d="M312,368 L312.0,396.0 Q312,400 316.0,400.0 L804.0,400.0 Q808,400 808.0,396.0 L808,368" marker-end="url(#cp58dja-tq)" data-from="cp58dja-lookup" data-to="cp58dja-platform" data-pts="312,368;312,400;808,400;808,368"/>
<text x="520" y="389" class="cp58dja-label" text-anchor="middle">成功 · ビルドを省略</text>
<path class="cp58dja-quiet" d="M872,368 L872,448" marker-end="url(#cp58dja-tq)" data-from="cp58dja-platform" data-to="cp58dja-releaseLookup" data-pts="872,368;872,448"/>
<path class="cp58dja-quiet" d="M704,476 L640,476" marker-end="url(#cp58dja-tq)" data-from="cp58dja-releaseLookup" data-to="cp58dja-done" data-pts="704,476;640,476"/>
<text x="672" y="465" class="cp58dja-mono" text-anchor="middle">200</text>
<path class="cp58dja-quiet" d="M744,504 L744.0,516.0 Q744,520 740.0,520.0 L316.0,520.0 Q312,520 312.0,516.0 L312,504" marker-end="url(#cp58dja-tq)" data-from="cp58dja-releaseLookup" data-to="cp58dja-create" data-pts="744,504;744,520;312,520;312,504"/>
<text x="672" y="509" class="cp58dja-mono" text-anchor="middle">404</text>
<path class="cp58dja-quiet" d="M704,464 L700.0,464.0 Q696,464 696.0,460.0 L696.0,428.0 Q696,424 692.0,424.0 L116.0,424.0 Q112,424 112.0,428.0 L112,448" marker-end="url(#cp58dja-tq)" data-from="cp58dja-releaseLookup" data-to="cp58dja-stop" data-pts="704,464;696,464;696,424;112,424;112,448"/>
<text x="176" y="413" class="cp58dja-label" text-anchor="middle">その他の状態</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" lang="ja" role="img" aria-labelledby="cp58aja-title cp58aja-desc">
<title id="cp58aja-title">実行時アーキテクチャ</title>
<desc id="cp58aja-desc">nginxとExpressは一つのイメージ内に置き、永続データを別にマウントします。</desc>
<style>
  svg{
    --bg:#0d1117; --surface-a:#1b222c; --surface-b:#151b23;
    --lead-a:#222b38; --lead-b:#19202a;
    --inner:#1e2530; --inner-lead:#232c39;
    --line:#252d38; --line-lead:#33404f;
    --text:#f0f6fc; --body:#c3ccd6; --dim:#a2abb5; --faint:#8d959f;
    --accent:#7c9fff; --accent-bg:rgba(124,159,255,.16);
    --ok:#4ac97e; --warn:#e0a740; --bad:#f2705e; --off:#8b939d;
    --quiet:#78818c;
    --sh:#000; --sh-op:.50; --shl-op:.58; --shs-op:.40;
    --glow-op:.40; --glow-cast:.45; --hl:rgba(255,255,255,.05);
  }
  @media (prefers-color-scheme: light){
    svg{
      --bg:#f6f8fa; --surface-a:#ffffff; --surface-b:#fafbfc;
      --lead-a:#ffffff; --lead-b:#f5f8ff;
      --inner:#eef1f4; --inner-lead:#e9f0fe;
      --line:#d8dee4; --line-lead:#b8c9ee;
      --text:#1f2328; --body:#3d444d; --dim:#59636e; --faint:#656d7a;
      --accent:#2f62d4; --accent-bg:rgba(47,98,212,.10);
      --ok:#187734; --warn:#8e5f00; --bad:#cf222e; --off:#5f6773;
      --quiet:#6e7781;
      --sh:#1f2328; --sh-op:.13; --shl-op:.18; --shs-op:.12;
      --glow-op:.35; --glow-cast:.14; --hl:transparent;
    }
  }
  .cp58aja-flow{fill:none;stroke:var(--accent);stroke-width:1.6;
          stroke-linecap:round;stroke-linejoin:round;
          stroke-dasharray:5 6;animation:cp58aja-move 2s linear infinite}
  .cp58aja-quiet{fill:none;stroke:var(--quiet);stroke-width:1.4;
           stroke-linecap:round;stroke-linejoin:round}
  @keyframes cp58aja-move{to{stroke-dashoffset:-22}}
  @media (prefers-reduced-motion:reduce){.cp58aja-flow{animation:none}}
</style>
<defs>
  <filter id="cp58aja-sh" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="var(--sh)" flood-opacity="var(--sh-op)"/>
  </filter>
  <filter id="cp58aja-shl" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="var(--sh)" flood-opacity="var(--shl-op)"/>
  </filter>
  <filter id="cp58aja-shs" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="var(--sh)" flood-opacity="var(--shs-op)"/>
  </filter>
  <filter id="cp58aja-gl" x="-60%" y="-90%" width="220%" height="280%">
    <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="var(--accent)" flood-opacity="var(--glow-op)"/>
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="var(--sh)" flood-opacity="var(--glow-cast)"/>
  </filter>
  <linearGradient id="cp58aja-s" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/>
  </linearGradient>
  <linearGradient id="cp58aja-sl" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/>
  </linearGradient>
  <marker id="cp58aja-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/>
  </marker>
  <marker id="cp58aja-tq" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/>
  </marker>
</defs>
<style>
  .cp58aja-root{font-family:"Pretendard",system-ui,-apple-system,sans-serif}
  .cp58aja-root{fill:var(--body)}
  .cp58aja-title{font-size:20px;font-weight:600;fill:var(--text)}
  .cp58aja-sub{font-size:13.5px;fill:var(--dim)}
  .cp58aja-name{font-size:15px;font-weight:500}
  .cp58aja-label{font-size:13px}
  .cp58aja-mono{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
  .cp58aja-foot{font-size:13px;fill:var(--faint)}
  .cp58aja-surface{fill:url(#cp58aja-s);stroke:var(--line);stroke-width:1}
  .cp58aja-lead{fill:url(#cp58aja-sl);stroke:var(--line-lead);stroke-width:1}
  .cp58aja-region{fill:var(--inner);stroke:var(--line);stroke-width:1}
  .cp58aja-cell{fill:var(--inner);stroke:var(--line);stroke-width:1}
  .cp58aja-highlight{stroke:var(--hl);stroke-width:1}
  .cp58aja-support{fill:var(--accent)}
  .cp58aja-off{fill:var(--faint)}
  </style>
<g class="cp58aja-root">
<rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>
<text x="32" y="40" class="cp58aja-title">実行時アーキテクチャ</text>
<text x="32" y="66" class="cp58aja-sub">nginxとExpressは一つのイメージ内に置き、永続データを別にマウントします。</text>
<rect id="cp58aja-image" data-kind="region" x="256" y="112" width="672" height="304" rx="12" class="cp58aja-region"/>
<text x="280" y="144" class="cp58aja-name" data-box="cp58aja-image">コンテナイメージ</text>
<text x="280" y="384" class="cp58aja-mono" data-box="cp58aja-image">Dockerfile · tini</text>
<rect id="cp58aja-browser" data-kind="card" x="32" y="192" width="176" height="120" rx="12" class="cp58aja-surface" filter="url(#cp58aja-sh)"/>
<path d="M48,193 H192" class="cp58aja-highlight"/>
<text x="52" y="224" class="cp58aja-name" data-box="cp58aja-browser">ブラウザー</text>
<text x="52" y="256" class="cp58aja-label" data-box="cp58aja-browser">Reactダッシュボード</text>
<text x="52" y="284" class="cp58aja-mono" data-box="cp58aja-browser">HTTPS</text>
<rect id="cp58aja-nginx" data-kind="card" x="288" y="192" width="208" height="120" rx="12" class="cp58aja-surface" filter="url(#cp58aja-sh)"/>
<path d="M304,193 H480" class="cp58aja-highlight"/>
<text x="308" y="224" class="cp58aja-name" data-box="cp58aja-nginx">nginx :8080</text>
<text x="308" y="256" class="cp58aja-label" data-box="cp58aja-nginx">Viteの静的ファイル</text>
<text x="308" y="284" class="cp58aja-mono" data-box="cp58aja-nginx">/usr/share/nginx/html</text>
<rect id="cp58aja-express" data-kind="card" x="624" y="192" width="256" height="120" rx="12" class="cp58aja-lead" filter="url(#cp58aja-shl)"/>
<path d="M640,193 H864" class="cp58aja-highlight"/>
<text x="644" y="224" class="cp58aja-name" data-box="cp58aja-express">Express :3001</text>
<text x="644" y="256" class="cp58aja-label" data-box="cp58aja-express">APIプロセス</text>
<text x="644" y="284" class="cp58aja-mono" data-box="cp58aja-express">api/server.js</text>
<path class="cp58aja-flow" d="M208,248 L288,248" marker-end="url(#cp58aja-t)" data-from="cp58aja-browser" data-to="cp58aja-nginx" data-pts="208,248;288,248"/>
<path class="cp58aja-quiet" d="M496,248 L624,248" marker-end="url(#cp58aja-tq)" data-from="cp58aja-nginx" data-to="cp58aja-express" data-pts="496,248;624,248"/>
<text x="248" y="237" class="cp58aja-label" text-anchor="middle">リクエスト</text>
<text x="560" y="237" class="cp58aja-label" text-anchor="middle">ローカルプロキシ</text>
<rect id="cp58aja-data" data-kind="card" x="576" y="448" width="304" height="72" rx="12" class="cp58aja-surface" filter="url(#cp58aja-sh)"/>
<path d="M592,449 H864" class="cp58aja-highlight"/>
<text x="596" y="480" class="cp58aja-name" data-box="cp58aja-data">永続ストレージのマウント</text>
<text x="596" y="500" class="cp58aja-mono" data-box="cp58aja-data">/data · JSON / 画像</text>
<path class="cp58aja-quiet" d="M728,312 L728,448" marker-end="url(#cp58aja-tq)" data-from="cp58aja-express" data-to="cp58aja-data" data-pts="728,312;728,448"/>
<text x="32" y="472" class="cp58aja-foot">nginx.conf · /api/ · /health</text>
<text x="32" y="500" class="cp58aja-foot">deployment.yaml · bookmarks-data</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" lang="ko" role="img" aria-labelledby="cp58dko-title cp58dko-desc">
<title id="cp58dko-title">독립적인 워크플로 분기</title>
<desc id="cp58dko-desc">이벤트가 워크플로를 직접 시작하며 Image는 CI 완료를 기다리지 않습니다.</desc>
<style>
  svg{
    --bg:#0d1117; --surface-a:#1b222c; --surface-b:#151b23;
    --lead-a:#222b38; --lead-b:#19202a;
    --inner:#1e2530; --inner-lead:#232c39;
    --line:#252d38; --line-lead:#33404f;
    --text:#f0f6fc; --body:#c3ccd6; --dim:#a2abb5; --faint:#8d959f;
    --accent:#7c9fff; --accent-bg:rgba(124,159,255,.16);
    --ok:#4ac97e; --warn:#e0a740; --bad:#f2705e; --off:#8b939d;
    --quiet:#78818c;
    --sh:#000; --sh-op:.50; --shl-op:.58; --shs-op:.40;
    --glow-op:.40; --glow-cast:.45; --hl:rgba(255,255,255,.05);
  }
  @media (prefers-color-scheme: light){
    svg{
      --bg:#f6f8fa; --surface-a:#ffffff; --surface-b:#fafbfc;
      --lead-a:#ffffff; --lead-b:#f5f8ff;
      --inner:#eef1f4; --inner-lead:#e9f0fe;
      --line:#d8dee4; --line-lead:#b8c9ee;
      --text:#1f2328; --body:#3d444d; --dim:#59636e; --faint:#656d7a;
      --accent:#2f62d4; --accent-bg:rgba(47,98,212,.10);
      --ok:#187734; --warn:#8e5f00; --bad:#cf222e; --off:#5f6773;
      --quiet:#6e7781;
      --sh:#1f2328; --sh-op:.13; --shl-op:.18; --shs-op:.12;
      --glow-op:.35; --glow-cast:.14; --hl:transparent;
    }
  }
  .cp58dko-flow{fill:none;stroke:var(--accent);stroke-width:1.6;
          stroke-linecap:round;stroke-linejoin:round;
          stroke-dasharray:5 6;animation:cp58dko-move 2s linear infinite}
  .cp58dko-quiet{fill:none;stroke:var(--quiet);stroke-width:1.4;
           stroke-linecap:round;stroke-linejoin:round}
  @keyframes cp58dko-move{to{stroke-dashoffset:-22}}
  @media (prefers-reduced-motion:reduce){.cp58dko-flow{animation:none}}
</style>
<defs>
  <filter id="cp58dko-sh" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="var(--sh)" flood-opacity="var(--sh-op)"/>
  </filter>
  <filter id="cp58dko-shl" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="var(--sh)" flood-opacity="var(--shl-op)"/>
  </filter>
  <filter id="cp58dko-shs" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="var(--sh)" flood-opacity="var(--shs-op)"/>
  </filter>
  <filter id="cp58dko-gl" x="-60%" y="-90%" width="220%" height="280%">
    <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="var(--accent)" flood-opacity="var(--glow-op)"/>
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="var(--sh)" flood-opacity="var(--glow-cast)"/>
  </filter>
  <linearGradient id="cp58dko-s" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/>
  </linearGradient>
  <linearGradient id="cp58dko-sl" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/>
  </linearGradient>
  <marker id="cp58dko-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/>
  </marker>
  <marker id="cp58dko-tq" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/>
  </marker>
</defs>
<style>
  .cp58dko-root{font-family:"Pretendard",system-ui,-apple-system,sans-serif}
  .cp58dko-root{fill:var(--body)}
  .cp58dko-title{font-size:20px;font-weight:600;fill:var(--text)}
  .cp58dko-sub{font-size:13.5px;fill:var(--dim)}
  .cp58dko-name{font-size:15px;font-weight:500}
  .cp58dko-label{font-size:13px}
  .cp58dko-mono{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
  .cp58dko-foot{font-size:13px;fill:var(--faint)}
  .cp58dko-surface{fill:url(#cp58dko-s);stroke:var(--line);stroke-width:1}
  .cp58dko-lead{fill:url(#cp58dko-sl);stroke:var(--line-lead);stroke-width:1}
  .cp58dko-region{fill:var(--inner);stroke:var(--line);stroke-width:1}
  .cp58dko-cell{fill:var(--inner);stroke:var(--line);stroke-width:1}
  .cp58dko-highlight{stroke:var(--hl);stroke-width:1}
  .cp58dko-support{fill:var(--accent)}
  .cp58dko-off{fill:var(--faint)}
  </style>
<g class="cp58dko-root">
<rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>
<text x="32" y="40" class="cp58dko-title">독립적인 워크플로 분기</text>
<text x="32" y="66" class="cp58dko-sub">이벤트가 워크플로를 직접 시작하며 Image는 CI 완료를 기다리지 않습니다.</text>
<text x="52" y="112" class="cp58dko-name">이벤트</text>
<text x="340" y="112" class="cp58dko-name">잡</text>
<text x="724" y="112" class="cp58dko-name">결과</text>
<rect id="cp58dko-event0" data-kind="card" x="32" y="136" width="208" height="96" rx="12" class="cp58dko-surface" filter="url(#cp58dko-sh)"/>
<path d="M48,137 H224" class="cp58dko-highlight"/>
<text x="52" y="168" class="cp58dko-label" data-box="cp58dko-event0">main push / main 대상 PR</text>
<text x="52" y="200" class="cp58dko-mono" data-box="cp58dko-event0">workflow_dispatch</text>
<rect id="cp58dko-job0" data-kind="card" x="320" y="136" width="304" height="96" rx="12" class="cp58dko-surface" filter="url(#cp58dko-sh)"/>
<path d="M336,137 H608" class="cp58dko-highlight"/>
<text x="340" y="164" class="cp58dko-mono" data-box="cp58dko-job0">quality · ci.yml</text>
<text x="340" y="190" class="cp58dko-label" data-box="cp58dko-job0">린트 / 테스트 / 감사</text>
<text x="340" y="212" class="cp58dko-label" data-box="cp58dko-job0">웹 / 확장 빌드</text>
<rect id="cp58dko-result0" data-kind="card" x="704" y="136" width="224" height="96" rx="12" class="cp58dko-surface" filter="url(#cp58dko-sh)"/>
<path d="M720,137 H912" class="cp58dko-highlight"/>
<text x="724" y="172" class="cp58dko-label" data-box="cp58dko-result0">컨테이너 스모크</text>
<path class="cp58dko-quiet" d="M240,184 L320,184" marker-end="url(#cp58dko-tq)" data-from="cp58dko-event0" data-to="cp58dko-job0" data-pts="240,184;320,184"/>
<path class="cp58dko-quiet" d="M624,184 L704,184" marker-end="url(#cp58dko-tq)" data-from="cp58dko-job0" data-to="cp58dko-result0" data-pts="624,184;704,184"/>
<rect id="cp58dko-event1" data-kind="card" x="32" y="256" width="208" height="96" rx="12" class="cp58dko-surface" filter="url(#cp58dko-sh)"/>
<path d="M48,257 H224" class="cp58dko-highlight"/>
<text x="52" y="288" class="cp58dko-label" data-box="cp58dko-event1">main push</text>
<text x="52" y="320" class="cp58dko-mono" data-box="cp58dko-event1">workflow_dispatch</text>
<rect id="cp58dko-job1" data-kind="card" x="320" y="256" width="304" height="96" rx="12" class="cp58dko-lead" filter="url(#cp58dko-shl)"/>
<path d="M336,257 H608" class="cp58dko-highlight"/>
<text x="340" y="284" class="cp58dko-mono" data-box="cp58dko-job1">publish · image.yml</text>
<text x="340" y="310" class="cp58dko-label" data-box="cp58dko-job1">linux/amd64 + linux/arm64</text>
<text x="340" y="332" class="cp58dko-label" data-box="cp58dko-job1">OCI 인덱스</text>
<rect id="cp58dko-result1" data-kind="card" x="704" y="256" width="224" height="96" rx="12" class="cp58dko-surface" filter="url(#cp58dko-sh)"/>
<path d="M720,257 H912" class="cp58dko-highlight"/>
<text x="724" y="292" class="cp58dko-label" data-box="cp58dko-result1">main / sha-&lt;12 hex&gt;</text>
<path class="cp58dko-quiet" d="M240,304 L320,304" marker-end="url(#cp58dko-tq)" data-from="cp58dko-event1" data-to="cp58dko-job1" data-pts="240,304;320,304"/>
<path class="cp58dko-flow" d="M624,304 L704,304" marker-end="url(#cp58dko-t)" data-from="cp58dko-job1" data-to="cp58dko-result1" data-pts="624,304;704,304"/>
<rect id="cp58dko-event2" data-kind="card" x="32" y="376" width="208" height="96" rx="12" class="cp58dko-surface" filter="url(#cp58dko-sh)"/>
<path d="M48,377 H224" class="cp58dko-highlight"/>
<text x="52" y="408" class="cp58dko-label" data-box="cp58dko-event2">vX.Y.Z 태그 push</text>
<text x="52" y="440" class="cp58dko-mono" data-box="cp58dko-event2">workflow_dispatch</text>
<rect id="cp58dko-job2" data-kind="card" x="320" y="376" width="304" height="96" rx="12" class="cp58dko-surface" filter="url(#cp58dko-sh)"/>
<path d="M336,377 H608" class="cp58dko-highlight"/>
<text x="340" y="404" class="cp58dko-mono" data-box="cp58dko-job2">release · release.yml</text>
<text x="340" y="430" class="cp58dko-label" data-box="cp58dko-job2">vX.Y.Z</text>
<text x="340" y="452" class="cp58dko-label" data-box="cp58dko-job2">tag = v + VERSION</text>
<rect id="cp58dko-result2" data-kind="card" x="704" y="376" width="224" height="96" rx="12" class="cp58dko-surface" filter="url(#cp58dko-sh)"/>
<path d="M720,377 H912" class="cp58dko-highlight"/>
<text x="724" y="412" class="cp58dko-label" data-box="cp58dko-result2">vX.Y.Z / Gitea 릴리스</text>
<text x="724" y="440" class="cp58dko-label" data-box="cp58dko-result2">이미지 / 릴리스 부재 시 생성</text>
<path class="cp58dko-quiet" d="M240,424 L320,424" marker-end="url(#cp58dko-tq)" data-from="cp58dko-event2" data-to="cp58dko-job2" data-pts="240,424;320,424"/>
<path class="cp58dko-flow" d="M624,424 L704,424" marker-end="url(#cp58dko-t)" data-from="cp58dko-job2" data-to="cp58dko-result2" data-pts="624,424;704,424"/>
<text x="32" y="516" class="cp58dko-foot">세 워크플로 모두 workflow_dispatch를 받으며 Release는 tag = v + VERSION을 요구합니다.</text>
</g>
</svg>

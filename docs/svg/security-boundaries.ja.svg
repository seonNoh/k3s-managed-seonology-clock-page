<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" lang="ja" role="img" aria-labelledby="cp58sja-title cp58sja-desc">
<title id="cp58sja-title">アクセスとストレージの境界</title>
<desc id="cp58sja-desc">中央GitOpsマニフェストのルート設定とボリューム配置</desc>
<style>
  svg{
    --bg:#0d1117; --surface-a:#1b222c; --surface-b:#151b23;
    --lead-a:#222b38; --lead-b:#19202a;
    --inner:#1e2530; --inner-lead:#232c39;
    --line:#252d38; --line-lead:#33404f;
    --text:#f0f6fc; --body:#c3ccd6; --dim:#a2abb5; --faint:#8d959f;
    --accent:#7c9fff; --accent-bg:rgba(124,159,255,.16);
    --ok:#4ac97e; --warn:#e0a740; --bad:#f2705e; --off:#8b939d;
    --quiet:#78818c;
    --sh:#000; --sh-op:.50; --shl-op:.58; --shs-op:.40;
    --glow-op:.40; --glow-cast:.45; --hl:rgba(255,255,255,.05);
  }
  @media (prefers-color-scheme: light){
    svg{
      --bg:#f6f8fa; --surface-a:#ffffff; --surface-b:#fafbfc;
      --lead-a:#ffffff; --lead-b:#f5f8ff;
      --inner:#eef1f4; --inner-lead:#e9f0fe;
      --line:#d8dee4; --line-lead:#b8c9ee;
      --text:#1f2328; --body:#3d444d; --dim:#59636e; --faint:#656d7a;
      --accent:#2f62d4; --accent-bg:rgba(47,98,212,.10);
      --ok:#187734; --warn:#8e5f00; --bad:#cf222e; --off:#5f6773;
      --quiet:#6e7781;
      --sh:#1f2328; --sh-op:.13; --shl-op:.18; --shs-op:.12;
      --glow-op:.35; --glow-cast:.14; --hl:transparent;
    }
  }
  .cp58sja-flow{fill:none;stroke:var(--accent);stroke-width:1.6;
          stroke-linecap:round;stroke-linejoin:round;
          stroke-dasharray:5 6;animation:cp58sja-move 2s linear infinite}
  .cp58sja-quiet{fill:none;stroke:var(--quiet);stroke-width:1.4;
           stroke-linecap:round;stroke-linejoin:round}
  @keyframes cp58sja-move{to{stroke-dashoffset:-22}}
  @media (prefers-reduced-motion:reduce){.cp58sja-flow{animation:none}}
</style>
<defs>
  <filter id="cp58sja-sh" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="var(--sh)" flood-opacity="var(--sh-op)"/>
  </filter>
  <filter id="cp58sja-shl" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="var(--sh)" flood-opacity="var(--shl-op)"/>
  </filter>
  <filter id="cp58sja-shs" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="var(--sh)" flood-opacity="var(--shs-op)"/>
  </filter>
  <filter id="cp58sja-gl" x="-60%" y="-90%" width="220%" height="280%">
    <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="var(--accent)" flood-opacity="var(--glow-op)"/>
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="var(--sh)" flood-opacity="var(--glow-cast)"/>
  </filter>
  <linearGradient id="cp58sja-s" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/>
  </linearGradient>
  <linearGradient id="cp58sja-sl" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/>
  </linearGradient>
  <marker id="cp58sja-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/>
  </marker>
  <marker id="cp58sja-tq" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/>
  </marker>
</defs>
<style>
  .cp58sja-root{font-family:"Pretendard",system-ui,-apple-system,sans-serif}
  .cp58sja-root{fill:var(--body)}
  .cp58sja-title{font-size:20px;font-weight:600;fill:var(--text)}
  .cp58sja-sub{font-size:13.5px;fill:var(--dim)}
  .cp58sja-name{font-size:15px;font-weight:500}
  .cp58sja-label{font-size:13px}
  .cp58sja-mono{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
  .cp58sja-foot{font-size:13px;fill:var(--faint)}
  .cp58sja-surface{fill:url(#cp58sja-s);stroke:var(--line);stroke-width:1}
  .cp58sja-lead{fill:url(#cp58sja-sl);stroke:var(--line-lead);stroke-width:1}
  .cp58sja-region{fill:var(--inner);stroke:var(--line);stroke-width:1}
  .cp58sja-cell{fill:var(--inner);stroke:var(--line);stroke-width:1}
  .cp58sja-highlight{stroke:var(--hl);stroke-width:1}
  .cp58sja-support{fill:var(--accent)}
  .cp58sja-off{fill:var(--faint)}
  </style>
<g class="cp58sja-root">
<rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>
<text x="32" y="40" class="cp58sja-title">アクセスとストレージの境界</text>
<text x="32" y="66" class="cp58sja-sub">中央GitOpsマニフェストのルート設定とボリューム配置</text>
<rect id="cp58sja-edge" data-kind="region" x="32" y="96" width="896" height="128" rx="12" class="cp58sja-region"/>
<text x="52" y="132" class="cp58sja-name" data-box="cp58sja-edge">Traefik · keycloak-auth</text>
<text x="52" y="164" class="cp58sja-mono" data-box="cp58sja-edge">clock.seonology.com</text>
<text x="52" y="196" class="cp58sja-mono" data-box="cp58sja-edge">seonology-tls-no-mtls</text>
<rect id="cp58sja-api" data-kind="card" x="336" y="120" width="264" height="80" rx="12" class="cp58sja-surface" filter="url(#cp58sja-sh)"/>
<path d="M352,121 H584" class="cp58sja-highlight"/>
<text x="356" y="152" class="cp58sja-name" data-box="cp58sja-api">API / 状態ルート</text>
<text x="356" y="180" class="cp58sja-label" data-box="cp58sja-api">優先度200 · アプリのヘッダー</text>
<rect id="cp58sja-ui" data-kind="card" x="624" y="120" width="280" height="80" rx="12" class="cp58sja-surface" filter="url(#cp58sja-sh)"/>
<path d="M640,121 H888" class="cp58sja-highlight"/>
<text x="644" y="152" class="cp58sja-name" data-box="cp58sja-ui">UIルート</text>
<text x="644" y="180" class="cp58sja-label" data-box="cp58sja-ui">優先度10 · コンソール埋め込み</text>
<rect id="cp58sja-pod" data-kind="region" x="32" y="248" width="896" height="232" rx="12" class="cp58sja-region"/>
<text x="52" y="280" class="cp58sja-name" data-box="cp58sja-pod">Pod · UID/GID 10001</text>
<rect id="cp58sja-root" data-kind="card" x="56" y="312" width="256" height="144" rx="12" class="cp58sja-surface" filter="url(#cp58sja-sh)"/>
<path d="M72,313 H296" class="cp58sja-highlight"/>
<text x="76" y="344" class="cp58sja-name" data-box="cp58sja-root">読み取り専用ルート</text>
<rect id="cp58sja-data" data-kind="card" x="336" y="312" width="256" height="144" rx="12" class="cp58sja-lead" filter="url(#cp58sja-shl)"/>
<path d="M352,313 H576" class="cp58sja-highlight"/>
<text x="356" y="344" class="cp58sja-name" data-box="cp58sja-data">永続データ</text>
<rect id="cp58sja-tmp" data-kind="card" x="616" y="312" width="288" height="144" rx="12" class="cp58sja-surface" filter="url(#cp58sja-sh)"/>
<path d="M632,313 H888" class="cp58sja-highlight"/>
<text x="636" y="344" class="cp58sja-name" data-box="cp58sja-tmp">一時ボリューム</text>
<text x="76" y="376" class="cp58sja-mono" data-box="cp58sja-root">/app</text>
<text x="76" y="404" class="cp58sja-mono" data-box="cp58sja-root">/usr/share/nginx/html</text>
<text x="356" y="376" class="cp58sja-mono" data-box="cp58sja-data">/data</text>
<text x="356" y="404" class="cp58sja-label" data-box="cp58sja-data">アプリデータ · 64 MiB PVC</text>
<text x="356" y="432" class="cp58sja-label" data-box="cp58sja-data">Velero: bookmarks-data</text>
<text x="636" y="376" class="cp58sja-mono" data-box="cp58sja-tmp">/tmp</text>
<text x="636" y="404" class="cp58sja-mono" data-box="cp58sja-tmp">/var/cache/nginx</text>
<text x="636" y="432" class="cp58sja-mono" data-box="cp58sja-tmp">/var/run/nginx</text>
<text x="32" y="516" class="cp58sja-foot">出典: 中央のingressroute.yamlとdeployment.yaml</text>
</g>
</svg>

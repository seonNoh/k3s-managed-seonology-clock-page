<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" lang="ko" role="img" aria-labelledby="cp58sko-title cp58sko-desc">
<title id="cp58sko-title">접근과 저장소 경계</title>
<desc id="cp58sko-desc">중앙 GitOps의 라우팅, 쓰기 가능 볼륨과 Secret 전달</desc>
<style>
  svg{
    --bg:#0d1117; --surface-a:#1b222c; --surface-b:#151b23;
    --lead-a:#222b38; --lead-b:#19202a;
    --inner:#1e2530; --inner-lead:#232c39;
    --line:#252d38; --line-lead:#33404f;
    --text:#f0f6fc; --body:#c3ccd6; --dim:#a2abb5; --faint:#8d959f;
    --accent:#7c9fff; --accent-bg:rgba(124,159,255,.16);
    --ok:#4ac97e; --warn:#e0a740; --bad:#f2705e; --off:#8b939d;
    --quiet:#78818c;
    --sh:#000; --sh-op:.50; --shl-op:.58; --shs-op:.40;
    --glow-op:.40; --glow-cast:.45; --hl:rgba(255,255,255,.05);
  }
  @media (prefers-color-scheme: light){
    svg{
      --bg:#f6f8fa; --surface-a:#ffffff; --surface-b:#fafbfc;
      --lead-a:#ffffff; --lead-b:#f5f8ff;
      --inner:#eef1f4; --inner-lead:#e9f0fe;
      --line:#d8dee4; --line-lead:#b8c9ee;
      --text:#1f2328; --body:#3d444d; --dim:#59636e; --faint:#656d7a;
      --accent:#2f62d4; --accent-bg:rgba(47,98,212,.10);
      --ok:#187734; --warn:#8e5f00; --bad:#cf222e; --off:#5f6773;
      --quiet:#6e7781;
      --sh:#1f2328; --sh-op:.13; --shl-op:.18; --shs-op:.12;
      --glow-op:.35; --glow-cast:.14; --hl:transparent;
    }
  }
  .cp58sko-flow{fill:none;stroke:var(--accent);stroke-width:1.6;
          stroke-linecap:round;stroke-linejoin:round;
          stroke-dasharray:5 6;animation:cp58sko-move 2s linear infinite}
  .cp58sko-quiet{fill:none;stroke:var(--quiet);stroke-width:1.4;
           stroke-linecap:round;stroke-linejoin:round}
  @keyframes cp58sko-move{to{stroke-dashoffset:-22}}
  @media (prefers-reduced-motion:reduce){.cp58sko-flow{animation:none}}
</style>
<defs>
  <filter id="cp58sko-sh" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="var(--sh)" flood-opacity="var(--sh-op)"/>
  </filter>
  <filter id="cp58sko-shl" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="var(--sh)" flood-opacity="var(--shl-op)"/>
  </filter>
  <filter id="cp58sko-shs" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="var(--sh)" flood-opacity="var(--shs-op)"/>
  </filter>
  <filter id="cp58sko-gl" x="-60%" y="-90%" width="220%" height="280%">
    <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="var(--accent)" flood-opacity="var(--glow-op)"/>
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="var(--sh)" flood-opacity="var(--glow-cast)"/>
  </filter>
  <linearGradient id="cp58sko-s" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/>
  </linearGradient>
  <linearGradient id="cp58sko-sl" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/>
  </linearGradient>
  <marker id="cp58sko-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/>
  </marker>
  <marker id="cp58sko-tq" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/>
  </marker>
</defs>
<style>
  .cp58sko-root{font-family:"Pretendard",system-ui,-apple-system,sans-serif}
  .cp58sko-root{fill:var(--body)}
  .cp58sko-title{font-size:20px;font-weight:600;fill:var(--text)}
  .cp58sko-sub{font-size:13.5px;fill:var(--dim)}
  .cp58sko-name{font-size:15px;font-weight:500}
  .cp58sko-label{font-size:13px}
  .cp58sko-mono{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
  .cp58sko-foot{font-size:13px;fill:var(--faint)}
  .cp58sko-surface{fill:url(#cp58sko-s);stroke:var(--line);stroke-width:1}
  .cp58sko-lead{fill:url(#cp58sko-sl);stroke:var(--line-lead);stroke-width:1}
  .cp58sko-region{fill:var(--inner);stroke:var(--line);stroke-width:1}
  .cp58sko-cell{fill:var(--inner);stroke:var(--line);stroke-width:1}
  .cp58sko-highlight{stroke:var(--hl);stroke-width:1}
  .cp58sko-support{fill:var(--accent)}
  .cp58sko-off{fill:var(--faint)}
  </style>
<g class="cp58sko-root">
<rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>
<text x="32" y="40" class="cp58sko-title">접근과 저장소 경계</text>
<text x="32" y="66" class="cp58sko-sub">중앙 GitOps의 라우팅, 쓰기 가능 볼륨과 Secret 전달</text>
<rect id="cp58sko-edge" data-kind="region" x="32" y="96" width="896" height="128" rx="12" class="cp58sko-region"/>
<text x="52" y="132" class="cp58sko-name" data-box="cp58sko-edge">Traefik · keycloak-auth</text>
<text x="52" y="164" class="cp58sko-mono" data-box="cp58sko-edge">clock.seonology.com</text>
<text x="52" y="196" class="cp58sko-mono" data-box="cp58sko-edge">seonology-tls-no-mtls</text>
<rect id="cp58sko-api" data-kind="card" x="336" y="120" width="264" height="80" rx="12" class="cp58sko-surface" filter="url(#cp58sko-sh)"/>
<path d="M352,121 H584" class="cp58sko-highlight"/>
<text x="356" y="152" class="cp58sko-name" data-box="cp58sko-api">API / 상태 경로</text>
<text x="356" y="180" class="cp58sko-label" data-box="cp58sko-api">우선순위 200 · 앱 헤더</text>
<rect id="cp58sko-ui" data-kind="card" x="624" y="120" width="280" height="80" rx="12" class="cp58sko-surface" filter="url(#cp58sko-sh)"/>
<path d="M640,121 H888" class="cp58sko-highlight"/>
<text x="644" y="152" class="cp58sko-name" data-box="cp58sko-ui">UI 경로</text>
<text x="644" y="180" class="cp58sko-label" data-box="cp58sko-ui">우선순위 10 · 콘솔 임베드</text>
<rect id="cp58sko-pod" data-kind="region" x="32" y="248" width="896" height="232" rx="12" class="cp58sko-region"/>
<text x="52" y="280" class="cp58sko-name" data-box="cp58sko-pod">Pod · UID/GID 10001</text>
<rect id="cp58sko-root" data-kind="card" x="56" y="312" width="208" height="144" rx="12" class="cp58sko-surface" filter="url(#cp58sko-sh)"/>
<path d="M72,313 H248" class="cp58sko-highlight"/>
<text x="76" y="344" class="cp58sko-name" data-box="cp58sko-root">읽기 전용 루트</text>
<rect id="cp58sko-data" data-kind="card" x="280" y="312" width="200" height="144" rx="12" class="cp58sko-surface" filter="url(#cp58sko-sh)"/>
<path d="M296,313 H464" class="cp58sko-highlight"/>
<text x="300" y="344" class="cp58sko-name" data-box="cp58sko-data">영구 데이터</text>
<rect id="cp58sko-tmp" data-kind="card" x="504" y="312" width="176" height="144" rx="12" class="cp58sko-surface" filter="url(#cp58sko-sh)"/>
<path d="M520,313 H664" class="cp58sko-highlight"/>
<text x="524" y="344" class="cp58sko-name" data-box="cp58sko-tmp">임시 볼륨</text>
<rect id="cp58sko-secret" data-kind="card" x="704" y="312" width="200" height="144" rx="12" class="cp58sko-lead" filter="url(#cp58sko-shl)"/>
<path d="M720,313 H888" class="cp58sko-highlight"/>
<text x="724" y="344" class="cp58sko-name" data-box="cp58sko-secret">Secret</text>
<text x="76" y="372" class="cp58sko-mono" data-box="cp58sko-root">/app</text>
<text x="76" y="400" class="cp58sko-mono" data-box="cp58sko-root">/usr/share/nginx/html</text>
<text x="300" y="372" class="cp58sko-mono" data-box="cp58sko-data">/data</text>
<text x="300" y="400" class="cp58sko-label" data-box="cp58sko-data">64 MiB PVC</text>
<text x="300" y="428" class="cp58sko-label" data-box="cp58sko-data">Velero: bookmarks-data</text>
<text x="524" y="372" class="cp58sko-mono" data-box="cp58sko-tmp">/tmp</text>
<text x="524" y="400" class="cp58sko-mono" data-box="cp58sko-tmp">/var/cache/nginx</text>
<text x="524" y="428" class="cp58sko-mono" data-box="cp58sko-tmp">/var/run/nginx</text>
<text x="724" y="372" class="cp58sko-label" data-box="cp58sko-secret">환경 변수 주입</text>
<text x="724" y="400" class="cp58sko-mono" data-box="cp58sko-secret">/cred/worklog</text>
<text x="724" y="428" class="cp58sko-label" data-box="cp58sko-secret">읽기 전용 인증서</text>
<text x="32" y="516" class="cp58sko-foot">근거: 중앙 ingressroute.yaml과 deployment.yaml</text>
</g>
</svg>
